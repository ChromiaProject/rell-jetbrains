# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html
# Rell version lives in gradle/libs.versions.toml
pluginGroup=net.postchain.rellide.jetbrains
pluginName=rell-jetbrains
pluginRepositoryUrl=https://bitbucket.org/chromawallet/rell-jetbrains
# SemVer format -> https://semver.org
pluginVersion=0.4.2
# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild=261.26222
pluginUntilBuild=262.*
# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
platformType=IU
platformVersion=2026.1.4
# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformBundledPlugins = com.intellij.java
platformBundledPlugins=com.intellij
# Bundled plugins kept off the test classpath. Everything but the last entry is the Gradle plugin's
# own default, which setting this property replaces. Since 2.18.0 the test classpath carries every
# bundled plugin from product-info, and Vue's LSP support provider dies in its static initializer
# when the platform enumerates LspServerSupportProvider — the logged ERROR fails whichever of our
# tests happens to open a file. 2.18.1 claims this exclusion in its changelog but does not ship it.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,org.jetbrains.plugins.vue
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false

org.gradle.configuration-cache=true

kotlin.code.style=official
