[versions]
kotlin = "2.4.0"
rell = "0.16.2"
antlr = "4.13.2"

intellij-platform = "2.18.1"
changelog = "2.2.1"
qodana = "2026.1.3"
kover = "0.9.9"
sentry-plugin = "5.8.0"

sentry = "8.39.1"
junit = "4.13.2"
opentest4j = "1.3.0"

[libraries]
sentry = { module = "io.sentry:sentry", version.ref = "sentry" }
rell-toolbox-common = { module = "net.postchain.rell:rell-toolbox-common", version.ref = "rell" }
junit = { module = "junit:junit", version.ref = "junit" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }
antlr = { module = "org.antlr:antlr4", version.ref = "antlr" }
antlr-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
sentry = { id = "io.sentry.jvm.gradle", version.ref = "sentry-plugin" }
