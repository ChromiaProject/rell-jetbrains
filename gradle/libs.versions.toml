[versions]
kotlin = "2.2.0"
rell = "0.15.4"

intellij-platform = "2.10.4"
changelog = "2.2.1"
qodana = "2024.1.9"
kover = "0.9.1"
sentry-plugin = "5.8.0"

sentry = "8.39.1"
jackson = "2.21.2"
junit = "4.13.2"
opentest4j = "1.3.0"

[libraries]
sentry = { module = "io.sentry:sentry", version.ref = "sentry" }
jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
junit = { module = "junit:junit", version.ref = "junit" }
opentest4j = { module = "org.opentest4j:opentest4j", version.ref = "opentest4j" }

rell-base = { module = "net.postchain.rell:rell-base", version.ref = "rell" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
sentry = { id = "io.sentry.jvm.gradle", version.ref = "sentry-plugin" }
