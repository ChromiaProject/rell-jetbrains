image: adoptopenjdk/openjdk11:alpine

definitions:
  steps:
    - step: &build-and-test-step
        name: Build and Test IntelliJ Plugin
        caches:
          - gradle
        script:
          - chmod +x ./gradlew
          - echo "Starting build..."
          - ./gradlew buildPlugin
          - echo "Build finished"
          - echo "Starting testing..."
          - ./gradlew test
          - echo "Tests finished"
        artifacts:
          - build/distributions/*.zip
    - step: &publish-step
        name: Publish Plugin to Marketplace
        deployment: production
        trigger: 'manual'
        script:
          - chmod +x ./gradlew
          - echo "Certificate chain $CERTIFICATE_CHAIN"
          - echo "Private Key $PRIVATE_KEY"
          - ./gradlew publishPlugin
          - echo "Publishing finished"
        artifacts:
          - build/distributions/*.zip

pipelines:
  default:
    - step:
        name: Dummy first step
        script:
          - echo "Hello World"
          - echo "Dummy step finished"
    - step: *publish-step
  branches:
    release/*:
      - step: *publish-step
  pull-requests:
    '**':
      - step: *build-and-test-step