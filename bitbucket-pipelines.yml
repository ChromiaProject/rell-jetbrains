image: adoptopenjdk/openjdk11:alpine

definitions:
  steps:
    - step: &build-and-test-step
        name: Build and Test IntelliJ Plugin
        caches:
          - gradle
        script:
          - chmod +x ./gradlew
          - echo "Starting build..."
          - ./gradlew buildPlugin
          - echo "Build finished"
          - echo "Starting testing..."
          - ./gradlew test
          - echo "Tests finished"
        artifacts:
          - build/distributions/*.zip
    - step: &publish-step
        name: Publish Plugin to Marketplace
        deployment: production
        trigger: 'manual'
        script:
          - chmod +x ./gradlew
          - echo $CERTIFICATE_CHAIN | base64 -d > ./certificate_chain.crt
          - export CERTIFICATE_CHAIN=`cat ./certificate_chain.crt`
          - echo $PRIVATE_KEY | base64 -d > ./private.pem
          - export PRIVATE_KEY="`cat ./private.pem`"
          - ./gradlew publishPlugin
          - echo "Publishing finished"
        artifacts:
          - build/distributions/*.zip

pipelines:
  branches:
    release/*:
      - step: *build-and-test-step
      - step: *publish-step
  pull-requests:
    '**':
      - step: *build-and-test-step