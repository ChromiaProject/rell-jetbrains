image: eclipse-temurin:21-jdk-noble

definitions:
  caches:
    gradle-wrapper: ~/.gradle/wrapper
    # Dependencies + local Gradle build cache + IntelliJ Platform distributions.
    # Keyed so the cache is re-saved whenever the build inputs change instead of
    # being frozen at first save like the predefined `gradle` cache.
    gradle-home:
      key: &gradle-cache-key
        files:
          - gradle/wrapper/gradle-wrapper.properties
          - gradle/libs.versions.toml
          - build.gradle.kts
          - settings.gradle.kts
          - gradle.properties
      path: ~/.gradle/caches
    # Configuration cache (.gradle/configuration-cache).
    gradle-project:
      key: *gradle-cache-key
      path: .gradle
    # Compiled outputs so incremental compilation has something to diff against
    # on a fresh container.
    gradle-build-output:
      key: *gradle-cache-key
      path: build
  steps:
    - step: &build-and-test-step
        name: Build and Test IntelliJ Plugin
        caches: [ gradle-wrapper, gradle-home, gradle-project, gradle-build-output ]
        script:
          - chmod +x ./gradlew
          - export GRADLE_OPTS='-Dorg.gradle.daemon=false'
          - ./gradlew --build-cache buildPlugin test
        artifacts: [ build/distributions/*.zip ]
    - step: &release-build-step
        name: Build and Test (release)
        size: 2x
        caches: [ gradle-wrapper, gradle-home, gradle-project, gradle-build-output ]
        script:
          - chmod +x ./gradlew ./get-lsp.sh
          # 2x step = 8192 MB. Budget: Gradle build JVM 3 GB heap + 768 MB
          # metaspace, Kotlin compile daemon 2 GB heap; the remaining ~2 GB
          # covers the forked test/headless-IDE JVMs and OS overhead.
          - export GRADLE_OPTS='-Xmx3g -XX:MaxMetaspaceSize=768m -Dorg.gradle.daemon=false'
          - export SENTRY_AUTH_TOKEN="$RELL_JETBRAINS_SENTRY_AUTH_TOKEN"
          - rm -rf language-server
          - ./get-lsp.sh
          - ./gradlew --build-cache "-Pkotlin.daemon.jvmargs=-Xmx2g" buildPlugin test
        artifacts: [ build/distributions/*.zip ]
    - step: &publish-step
        name: Publish to JetBrains Marketplace
        size: 2x
        trigger: manual
        deployment: Production
        caches: [ gradle-wrapper, gradle-home, gradle-project, gradle-build-output ]
        script:
          - chmod +x ./gradlew ./get-lsp.sh
          # Released versions are tagged with the plain version number; refuse to
          # re-publish a version that already has a tag.
          - VERSION=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          - |
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
              echo "Tag $VERSION already exists. Bump pluginVersion before releasing." >&2
              exit 1
            fi
          # Same 8192 MB budget as the release build step.
          - export GRADLE_OPTS='-Xmx3g -XX:MaxMetaspaceSize=768m -Dorg.gradle.daemon=false'
          - export SENTRY_AUTH_TOKEN="$RELL_JETBRAINS_SENTRY_AUTH_TOKEN"
          - export PRIVATE_KEY_PASSWORD="$RELL_JETBRAINS_PRIVATE_KEY_PASSWORD"
          - export PUBLISH_TOKEN="$RELL_JETBRAINS_PUBLISH_TOKEN"
          # The build reads CERTIFICATE_CHAIN / PRIVATE_KEY as file paths, so the
          # secured variables hold base64-encoded content decoded here.
          - echo "$RELL_JETBRAINS_CERTIFICATE_CHAIN" | base64 -d > /tmp/chain.crt
          - echo "$RELL_JETBRAINS_PRIVATE_KEY" | base64 -d > /tmp/private.pem
          - export CERTIFICATE_CHAIN=/tmp/chain.crt PRIVATE_KEY=/tmp/private.pem
          - rm -rf language-server
          - ./get-lsp.sh
          - ./gradlew --build-cache "-Pkotlin.daemon.jvmargs=-Xmx2g" publishPlugin
          - git tag "$VERSION" "$BITBUCKET_COMMIT"
          - git push origin "refs/tags/$VERSION"

pipelines:
  pull-requests:
    '**':
      - step: *build-and-test-step
  branches:
    main:
      - step: *release-build-step
      - step: *publish-step
