image: eclipse-temurin:21-jdk-noble

definitions:
  caches:
    gradle-wrapper: ~/.gradle/wrapper
    # Dependencies + local Gradle build cache + IntelliJ Platform distributions.
    # Keyed so the cache is re-saved whenever the build inputs change instead of
    # being frozen at first save like the predefined `gradle` cache.
    gradle-home:
      key: &gradle-cache-key
        files:
          - gradle/wrapper/gradle-wrapper.properties
          - gradle/libs.versions.toml
          - build.gradle.kts
          - settings.gradle.kts
          - gradle.properties
      path: ~/.gradle/caches
    # Configuration cache (.gradle/configuration-cache).
    gradle-project:
      key: *gradle-cache-key
      path: .gradle
    # Compiled outputs so incremental compilation has something to diff against
    # on a fresh container.
    gradle-build-output:
      key: *gradle-cache-key
      path: build
  steps:
    - step: &build-and-test-step
        name: Build and Test IntelliJ Plugin
        caches: [ gradle-wrapper, gradle-home, gradle-project, gradle-build-output ]
        script:
          - chmod +x ./gradlew
          - ./gradlew --build-cache buildPlugin test
        artifacts: [ build/distributions/*.zip ]
    - step: &release-build-step
        name: Build, Test and Verify (release)
        size: 2x
        caches: [ gradle-wrapper, gradle-home, gradle-project, gradle-build-output ]
        script:
          - chmod +x ./gradlew ./get-lsp.sh
          # 2x step = 8192 MB. Budget: Gradle build JVM 3 GB heap + 768 MB
          # metaspace, Kotlin compile daemon 2 GB heap; the remaining ~2 GB
          # covers the forked JVMs — test/headless IDE first, then the plugin
          # verifier, which runs after the test JVMs are gone.
          - export GRADLE_OPTS='-Xmx3g -XX:MaxMetaspaceSize=768m'
          - export SENTRY_AUTH_TOKEN="$RELL_JETBRAINS_SENTRY_AUTH_TOKEN"
          - rm -rf language-server
          - ./get-lsp.sh
          # verifyPlugin runs the JetBrains Plugin Verifier against every IDE in
          # the supported build range — the same check the Marketplace applies
          # after upload, and what sank 0.4.1. It gates the manual publish step
          # below, which Bitbucket only offers once this step is green.
          - ./gradlew --build-cache "-Pkotlin.daemon.jvmargs=-Xmx2g" buildPlugin test verifyPlugin
        artifacts:
          - build/distributions/*.zip
          # Per-IDE verifier reports, kept so a passing run can still be
          # inspected for warnings the failure level does not act on.
          - build/reports/pluginVerifier/**
          # The console prints only the assertion class and line for a failing
          # test; the stack trace that says why lives in these.
          - build/reports/tests/**
          - build/test-results/**
    - step: &publish-step
        name: Publish to JetBrains Marketplace
        size: 2x
        trigger: manual
        deployment: Production
        caches: [ gradle-wrapper, gradle-home, gradle-project, gradle-build-output ]
        script:
          - chmod +x ./gradlew ./get-lsp.sh
          # The temurin image has no git; the clone happens in the build setup
          # phase, so the tag guard and the tag push below need it installed.
          - apt-get update && apt-get install -y --no-install-recommends git curl
          # Released versions are tagged with the plain version number; refuse to
          # re-publish a version that already has a tag.
          - VERSION=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          - |
            git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null && status=0 || status=$?
            if [ "$status" -eq 0 ]; then
              echo "Tag $VERSION already exists. Bump pluginVersion before releasing." >&2
              exit 1
            elif [ "$status" -ne 2 ]; then
              echo "git ls-remote failed with status $status." >&2
              exit 1
            fi
          # Same 8192 MB budget as the release build step.
          - export GRADLE_OPTS='-Xmx3g -XX:MaxMetaspaceSize=768m'
          - export SENTRY_AUTH_TOKEN="$RELL_JETBRAINS_SENTRY_AUTH_TOKEN"
          # A missing token silently disables source context (build.gradle.kts),
          # and a revoked one only fails deep inside the build — check both here.
          - |
            if [ -z "$SENTRY_AUTH_TOKEN" ]; then
              echo "SENTRY_AUTH_TOKEN is empty: set RELL_JETBRAINS_SENTRY_AUTH_TOKEN before releasing." >&2
              exit 1
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 \
              -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
              https://sentry.io/api/0/organizations/chromaway-ab-za/)
            case "$code" in
              2??) ;;
              *)
                echo "Sentry rejected SENTRY_AUTH_TOKEN (HTTP $code). Rotate the token before releasing." >&2
                exit 1
                ;;
            esac
          - export PRIVATE_KEY_PASSWORD="$RELL_JETBRAINS_PRIVATE_KEY_PASSWORD"
          - export PUBLISH_TOKEN="$RELL_JETBRAINS_PUBLISH_TOKEN"
          # The build reads CERTIFICATE_CHAIN / PRIVATE_KEY as file paths, so the
          # secured variables hold base64-encoded content decoded here.
          - echo "$RELL_JETBRAINS_CERTIFICATE_CHAIN" | base64 -d > /tmp/chain.crt
          - echo "$RELL_JETBRAINS_PRIVATE_KEY" | base64 -d > /tmp/private.pem
          - export CERTIFICATE_CHAIN=/tmp/chain.crt PRIVATE_KEY=/tmp/private.pem
          - rm -rf language-server
          - ./get-lsp.sh
          - ./gradlew --build-cache "-Pkotlin.daemon.jvmargs=-Xmx2g" publishPlugin
          - git tag "$VERSION" "$BITBUCKET_COMMIT"
          - git push origin "refs/tags/$VERSION"

pipelines:
  pull-requests:
    '**':
      - step: *build-and-test-step
  branches:
    main:
      - step: *release-build-step
      - step: *publish-step
